<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نافذة مسببات الحساسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

    <!-- زر فتح النافذة -->
    <button id="openModal"
        class="bg-teal-600 text-white px-6 py-2 rounded-lg shadow-md hover:bg-teal-700 active:scale-95 transition">
        إظهار مسببات الحساسية
    </button>

    <!-- النافذة المنبثقة -->
    <div id="modal"
        class="fixed inset-0 bg-black/40 flex items-end justify-center opacity-0 pointer-events-none transition-all duration-300">

        <!-- محتوى النافذة -->
        <div
            class="bg-amber-50 w-full max-w-md rounded-t-3xl p-6 shadow-lg transform translate-y-full transition-all duration-500 ease-out">

            <!-- رأس النافذة -->
            <div class="flex justify-between items-center border-b border-teal-300 pb-3 mb-4">
                <h2 class="text-teal-900 font-bold text-lg">🩺 مسببات الحساسية</h2>
                <button id="closeModal" class="text-teal-600 font-bold hover:text-red-600 transition-colors">إغلاق
                    ✖</button>
            </div>

            <!-- محتوى النافذة -->
            <div class="space-y-3">
                <div
                    class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm hover:shadow-md transition">
                    <div>
                        <h3 class="font-medium text-teal-900">مكسرات</h3>
                        <p class="text-sm text-teal-600">مثل الفستق، الكاجو، واللوز</p>
                    </div>
                    <div class="bg-teal-600 text-white p-2 rounded-full text-lg">🥜</div>
                </div>

                <div
                    class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm hover:shadow-md transition">
                    <div>
                        <h3 class="font-medium text-teal-900">زبدة الفول السوداني</h3>
                        <p class="text-sm text-teal-600">منتج مشتق من الفول السوداني</p>
                    </div>
                    <div class="bg-teal-600 text-white p-2 rounded-full text-lg">🥪</div>
                </div>

                <div
                    class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm hover:shadow-md transition">
                    <div>
                        <h3 class="font-medium text-teal-900">قمح</h3>
                        <p class="text-sm text-teal-600">مثل الخبز، المعكرونة، الدقيق</p>
                    </div>
                    <div class="bg-teal-600 text-white p-2 rounded-full text-lg">🌾</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const openModal = document.getElementById('openModal');
        const closeModal = document.getElementById('closeModal');
        const modal = document.getElementById('modal');
        const modalContent = modal.querySelector('div');

        openModal.addEventListener('click', () => {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('translate-y-full');
        });

        closeModal.addEventListener('click', () => {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('translate-y-full');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('translate-y-full');
            }
        });
    </script>

</body>

</html>
